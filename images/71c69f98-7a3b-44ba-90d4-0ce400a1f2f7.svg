<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1240 800' font-family='IBM Plex Sans, Segoe UI, sans-serif'><rect width='1240' height='800' fill='#F3EFE6'/><text x='60' y='72' font-size='38' font-weight='700' fill='#1b1a16'>Autonomous Voice Agent &#8212; on-prem architecture</text><text x='60' y='108' font-size='19' fill='#6b6250'>12 containerised services &#183; entirely on-premises &#183; orchestrated with Docker &#183; 1.05 s end-to-end</text><text x='60' y='176' font-size='15' font-weight='700' letter-spacing='2' fill='#2B27D8'>SIGNAL CHAIN</text><rect x='40' y='196' width='170' height='96' rx='9' fill='#2B27D8'/><text x='125' y='238' text-anchor='middle' font-size='17' font-weight='700' fill='#ffffff'>FreeSWITCH</text><text x='125' y='264' text-anchor='middle' font-size='12.5' fill='#cfd0f6'>SIP / RTP telephony</text><path d='M 210 244 l 24 0' stroke='#9a93c8' stroke-width='2.5' marker-end='url(#ar)'/><rect x='234' y='196' width='170' height='96' rx='9' fill='#2B27D8'/><text x='319' y='238' text-anchor='middle' font-size='17' font-weight='700' fill='#ffffff'>Voice Gateway</text><text x='319' y='264' text-anchor='middle' font-size='12.5' fill='#cfd0f6'>FastAPI WebSocket</text><path d='M 404 244 l 24 0' stroke='#9a93c8' stroke-width='2.5' marker-end='url(#ar)'/><rect x='428' y='196' width='170' height='96' rx='9' fill='#2B27D8'/><text x='513' y='238' text-anchor='middle' font-size='17' font-weight='700' fill='#ffffff'>faster-Whisper</text><text x='513' y='264' text-anchor='middle' font-size='12.5' fill='#cfd0f6'>STT · int8 · 17% WER</text><path d='M 598 244 l 24 0' stroke='#9a93c8' stroke-width='2.5' marker-end='url(#ar)'/><rect x='622' y='196' width='170' height='96' rx='9' fill='#2B27D8'/><text x='707' y='238' text-anchor='middle' font-size='17' font-weight='700' fill='#ffffff'>Rasa NLU + Core</text><text x='707' y='264' text-anchor='middle' font-size='12.5' fill='#cfd0f6'>39 intents · 98% F1</text><path d='M 792 244 l 24 0' stroke='#9a93c8' stroke-width='2.5' marker-end='url(#ar)'/><rect x='816' y='196' width='170' height='96' rx='9' fill='#2B27D8'/><text x='901' y='238' text-anchor='middle' font-size='17' font-weight='700' fill='#ffffff'>Action Server</text><text x='901' y='264' text-anchor='middle' font-size='12.5' fill='#cfd0f6'>business logic</text><path d='M 986 244 l 24 0' stroke='#9a93c8' stroke-width='2.5' marker-end='url(#ar)'/><rect x='1010' y='196' width='170' height='96' rx='9' fill='#2B27D8'/><text x='1095' y='238' text-anchor='middle' font-size='17' font-weight='700' fill='#ffffff'>Piper TTS</text><text x='1095' y='264' text-anchor='middle' font-size='12.5' fill='#cfd0f6'>~50 ms synthesis</text><text x='60' y='396' font-size='15' font-weight='700' letter-spacing='2' fill='#C05621'>SUPPORTING SERVICES</text><rect x='40' y='416' width='170' height='96' rx='9' fill='#ffffff' stroke='#C05621' stroke-width='2'/><text x='125' y='458' text-anchor='middle' font-size='16' font-weight='700' fill='#8a3f18'>Silero VAD</text><text x='125' y='484' text-anchor='middle' font-size='12.5' fill='#9a6a4a'>turn-taking</text><path d='M 125 416 l 0 -20' stroke='#d8b48a' stroke-width='2' stroke-dasharray='4 4'/><rect x='234' y='416' width='170' height='96' rx='9' fill='#ffffff' stroke='#C05621' stroke-width='2'/><text x='319' y='458' text-anchor='middle' font-size='16' font-weight='700' fill='#8a3f18'>Duckling</text><text x='319' y='484' text-anchor='middle' font-size='12.5' fill='#9a6a4a'>entity parsing</text><path d='M 319 416 l 0 -20' stroke='#d8b48a' stroke-width='2' stroke-dasharray='4 4'/><rect x='428' y='416' width='170' height='96' rx='9' fill='#ffffff' stroke='#C05621' stroke-width='2'/><text x='513' y='458' text-anchor='middle' font-size='16' font-weight='700' fill='#8a3f18'>ChromaDB + bge-m3</text><text x='513' y='484' text-anchor='middle' font-size='12.5' fill='#9a6a4a'>RAG retrieval</text><path d='M 513 416 l 0 -20' stroke='#d8b48a' stroke-width='2' stroke-dasharray='4 4'/><rect x='622' y='416' width='170' height='96' rx='9' fill='#ffffff' stroke='#C05621' stroke-width='2'/><text x='707' y='458' text-anchor='middle' font-size='16' font-weight='700' fill='#8a3f18'>Ollama</text><text x='707' y='484' text-anchor='middle' font-size='12.5' fill='#9a6a4a'>LLM fallback</text><path d='M 707 416 l 0 -20' stroke='#d8b48a' stroke-width='2' stroke-dasharray='4 4'/><rect x='816' y='416' width='170' height='96' rx='9' fill='#ffffff' stroke='#C05621' stroke-width='2'/><text x='901' y='458' text-anchor='middle' font-size='16' font-weight='700' fill='#8a3f18'>EspoCRM</text><text x='901' y='484' text-anchor='middle' font-size='12.5' fill='#9a6a4a'>debtor records</text><path d='M 901 416 l 0 -20' stroke='#d8b48a' stroke-width='2' stroke-dasharray='4 4'/><rect x='1010' y='416' width='170' height='96' rx='9' fill='#ffffff' stroke='#C05621' stroke-width='2'/><text x='1095' y='458' text-anchor='middle' font-size='16' font-weight='700' fill='#8a3f18'>Django + Next.js</text><text x='1095' y='484' text-anchor='middle' font-size='12.5' fill='#9a6a4a'>governance portal</text><path d='M 1095 416 l 0 -20' stroke='#d8b48a' stroke-width='2' stroke-dasharray='4 4'/><rect x='40' y='600' width='1160' height='150' rx='12' fill='#ECE3D1'/><text x='64' y='648' font-size='16' font-weight='700' fill='#1b1a16'>Data residency</text><text x='64' y='680' font-size='14.5' fill='#5a5240'>A bank cannot send customer audio to a cloud API &#8212; speech recognition, dialogue, retrieval and</text><text x='64' y='704' font-size='14.5' fill='#5a5240'>synthesis all run inside the building, on constrained CPU-only hardware, inside a one-second budget.</text><defs><marker id='ar' markerWidth='9' markerHeight='9' refX='7' refY='4.5' orient='auto'><path d='M0 0 L9 4.5 L0 9 z' fill='#9a93c8'/></marker></defs></svg>